name: Build AirBox

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: AirBox
        run: xcodegen generate --spec project.yml

      - name: Check project
        working-directory: AirBox
        run: |
          ls -la
          test -d AirBox.xcodeproj

      - name: Build AirBox
        working-directory: AirBox
        run: |
          xcodebuild \
            -project AirBox.xcodeproj \
            -scheme AirBox \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload AirBox.app
        uses: actions/upload-artifact@v4
        with:
          name: AirBox-iOS-build
          path: AirBox/build/DerivedData/Build/Products/Debug-iphonesimulator/AirBox.app
