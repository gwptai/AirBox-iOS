name: Build AirBox

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: AirBox
        run: |
          rm -rf AirBox.xcodeproj build
          xcodegen generate --spec project.yml

      - name: Check project
        working-directory: AirBox
        run: |
          ls -la
          test -d AirBox.xcodeproj
          test -f Info.plist

      - name: Build unsigned iOS archive
        working-directory: AirBox
        run: |
          xcodebuild \
            -project AirBox.xcodeproj \
            -scheme AirBox \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build/AirBox.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Create IPA
        working-directory: AirBox
        run: |
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R build/AirBox.xcarchive/Products/Applications/AirBox.app ipa/Payload/
          cd ipa
          zip -qry ../AirBox.ipa Payload
          cd ..
          ls -lh AirBox.ipa
          unzip -l AirBox.ipa | head -30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirBox-IPA
          path: AirBox/AirBox.ipa
          if-no-files-found: error
